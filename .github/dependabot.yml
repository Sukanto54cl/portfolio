version: 2

updates:
  # =========================
  # NPM (Node.js dependencies)
  # =========================
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"

    # Ignore ESLint v10 (peer dependency conflict for now)
    ignore:
      - dependency-name: "eslint"
        versions: ["10.x"]
      - dependency-name: "@eslint/js"
        versions: ["10.x"]
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      - dependency-name: "global"
        update-types: ["version-update:semver-major"]

    # Group all npm updates into one PR
    groups:
      npm-dependencies:
        patterns:
          - "*"

    open-pull-requests-limit: 5

    commit-message:
      prefix: "deps"

    labels:
      - "dependencies"


  # =========================
  # GitHub Actions
  # =========================
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

    commit-message:
      prefix: "ci"

    labels:
      - "github-actions"


  # =========================
  # Docker (if using Dockerfile)
  # =========================
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"

    commit-message:
      prefix: "docker"

    labels:
      - "docker"
